
version: '3.8'
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=Europe/Prague  # <--- nastavení času
    depends_on:
      - db
  
  db:
    image: mysql:8.0
    container_name: kmi_mysql_db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: univerzita
      MYSQL_ROOT_PASSWORD: heslo
      TZ: Europe/Prague   # <---  nastavení času
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Namontování init.sql pro automatický import při prvním spuštění
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data: